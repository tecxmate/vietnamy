document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

nd module types from your roadmap, read as a table of contents.<\u002Fdiv>\n<div><b style=\"color:#1B1A3A\">Talk<\u002Fb> — situations, not a chatbot. Every card is one of your existing <code style=\"font-size:11px;background:rgba(27,26,58,.07);padding:1px 4px;border-radius:3px\">scene_*<\u002Fcode> nodes. Text-first with a mic; corrections land as a teal \"more natural\" rule, not a red X.<\u002Fdiv>\n<div><b style=\"color:#1B1A3A\">Dict<\u002Fb> — the 447K entries, treated as the editorial asset they are. Entry = navy spread with etymology.<\u002Fdiv>\n<div><b style=\"color:#1B1A3A\">Explore<\u002Fb> (Khám phá) — YouTube under a dual-subtitle overlay; the transcript is the interface, timecodes seek.<\u002Fdiv>\n<div><b style=\"color:#1B1A3A\">Library<\u002Fb> (Thư viện) — the browsable catalog of standalone modules. Tone trainer is the hero here, per your answer.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"height:8px\"><\u002Fdiv>\n<div style=\"font:800 10.5px 'Be Vietnam Pro',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#9a8f74\">Palette<\u002Fdiv>\n<div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n<div style=\"width:52px;height:52px;border-radius:9px;background:#EE4A75\"><\u002Fdiv>\n<div style=\"width:52px;height:52px;border-radius:9px;background:#204081\"><\u002Fdiv>\n<div style=\"width:52px;height:52px;border-radius:9px;background:#38BA94\"><\u002Fdiv>\n<div style=\"width:52px;height:52px;border-radius:9px;background:#FCBD1B\"><\u002Fdiv>\n<div style=\"width:52px;height:52px;border-radius:9px;background:#FBF3E2;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)\"><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-size:11.5px;line-height:1.5;color:#57514a\">Pink is the only CTA colour, one hero per screen, navy for entries and checkmarks, teal and gold as accents only. Depth is hard offset shadow — never blur.<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<p style=\"margin:26px 0 0;font:12px/1.5 'Be Vietnam Pro',sans-serif;color:rgba(27,26,58,.5)\">Try next: \"give m with a counter — \"bát\" for a bowl.' },\n      { from: 'ai', vi: 'Bát to hay bát nhỏ?', en: 'Large bowl or small bowl?' },\n    ],\n  };\n\n\n  WORDS = {\n    'Xin': { gloss: 'please', pos: 'particle', mark: 'known',\n      def: 'Politeness particle that opens a request or a greeting.',\n      note: 'Xin softens whatever follows. Drop it with friends, keep it with strangers and anyone older.',\n      senses: [{ def: 'Politeness opener before a greeting.', exVi: 'Xin chào!', exEn: 'Hello!' }, { def: 'To ask for, to request.', exVi: 'Tôi xin một ly nước.', exEn: 'I ask for a glass of water.' }],\n      colls: [{ vi: 'xin chào', en: 'hello' }, { vi: 'xin lỗi', en: 'sorry' }, { vi: 'xin phép', en: 'may I' }] },\n    'chào': { gloss: 'greet', pos: 'verb', mark: 'known',\n      def: 'To greet. Xin chào is the all-purpose hello.',\n      note: 'In real life people greet with the pronoun instead: chào anh, chào chị, chào em.',\n      senses: [{ def: 'To greet someone on meeting.', exVi: 'Chào anh!', exEn: 'Hello (to an older man).' }, { def: 'To say goodbye.', exVi: 'Chào nhé!', exEn: 'Bye then!' }],\n      colls: [{ vi: 'chào anh', en: 'hello (m.)' }, { vi: 'chào chị', en: 'hello (f.)' }, { vi: 'chào buổi sáng', en: 'good morning' }] },\n    'Cảm ơn': { gloss: 'thank you', pos: 'phrase', mark: 'known',\n      def: 'Thank you. Add a pronoun after it — cảm ơn anh, cảm ơn chị.',\n      note: 'Northern speakers often say cám ơn. Both are correct; the tone on the first syllable is the only difference.',\n      senses: [{ def: 'To thank someone.', exVi: 'Cảm ơn chị nhiều.', exEn: 'Thank you very much.' }],\n      colls: [{ vi: 'cảm ơn nhiều', en: 'thanks a lot' }, { vi: 'cảm ơn trước', en: 'thanks in advance' }] },\n    'nhiều': { gloss: 'a lot', pos: 'adverb', mark: 'known',\n      def: 'Much, many, a lot. Follows the word it intensifies.',\n      note: 'Unlike English, nhiều comes after the verb or noun: ăn nhiều, không nhiều.',\n      senses: [{ def: 'A lot, much (degree).', exVi: 'Cảm ơn nhiều.', exEn: 'Thanks a lot.' }, { def: 'Many (quantity).', exVi: 'Nhiều người quá.', exEn: 'Too many people.' }],\n      colls: [{ vi: 'rất nhiều', en: 'very many' }, { vi: 'nhiều người', en: 'many people' }] },\n    'Cái này': { gloss: 'this one', pos: 'phrase', mark: 'new',\n      def: 'This one. Cái is the general classifier for objects.',\n      note: 'Pointing plus cái này gets you through any market. Swap cái for the right classifier when you know it — con for animals, quả for fruit.',\n      senses: [{ def: 'This thing, this one (pointing).', exVi: 'Cái này bao nhiêu tiền?', exEn: 'How much is this?' }, { def: 'This matter, this issue.', exVi: 'Cái này khó nói.', exEn: 'This is hard to explain.' }],\n      colls: [{ vi: 'cái kia', en: 'that one' }, { vi: 'cái nào', en: 'which one' }, { vi: 'cái gì', en: 'what' }] },\n    'bao nhiêu': { gloss: 'how much', pos: 'phrase', mark: 'new',\n      def: 'How much, how many. Goes where the number would go, not at the front.',\n      note: 'Word order is the trap: Cái này bao nhiêu tiền — literally \"this one how-much money\".',\n      senses: [{ def: 'How much (price, amount).', exVi: 'Bao nhiêu tiền?', exEn: 'How much money?' }, { def: 'How many (count).', exVi: 'Anh có bao nhiêu con?', exEn: 'How many children do you have?' }, { def: 'However much (concessive).', exVi: 'Bao nhiêu cũng được.', exEn: 'However much is fine.' }],\n      colls: [{ vi: 'bao nhiêu tiền', en: 'how much money' }, { vi: 'bao nhiêu tuổi', en: 'how old' }, { vi: 'bao nhiêu lâu', en: 'how long' }] },\n    'tiền': {\n      tone: 'huyền',\n      seen: [\n        { t: '1:10', src: 'Video · 20 câu cho người mới', line: 'Cái này bao nhiêu tiền?', go: 'video' },\n        { t: 'Turn 4', src: 'Talk · chợ roleplay', line: 'Bao nhiêu tiền một ký?', go: 'chat' },\n      ], gloss: 'money', pos: 'noun', mark: 'new',\n      def: 'Money. Bao nhiêu tiền is the standard way to ask a price.',\n      note: 'Prices are spoken in nghìn (thousand): \"bốn mươi nghìn\" = 40,000 đồng. Locals often drop nghìn and just say \"bốn mươi\".',\n      senses: [{ def: 'Money, cash.', exVi: 'Tôi không có tiền.', exEn: 'I have no money.' }, { def: 'Price, cost (in questions).', exVi: 'Bao nhiêu tiền?', exEn: 'How much?' }],\n      colls: [{ vi: 'tính tiền', en: 'the bill, please' }, { vi: 'tiền mặt', en: 'cash' }, { vi: 'trả tiền', en: 'to pay' }] },\n    'Đắt': { gloss: 'expensive', pos: 'adjective', mark: 'new',\n      def: 'Expensive.',\n      note: 'Northern word. In Saigon you will hear mắc far more often — same meaning.',\n      senses: [{ def: 'Expensive, costly.', exVi: 'Đắt quá!', exEn: 'Too expensive!' }, { def: 'In demand, sought after.', exVi: 'Hàng này đắt khách.', exEn: 'These goods sell well.' }],\n      colls: [{ vi: 'đắt quá', en: 'too expensive' }, { vi: 'đắt hơn', en: 'more expensive' }, { vi: 'mắc', en: 'expensive (South)' }] },\n    'quá': { gloss: 'too', pos: 'adverb', mark: 'known',\n      def: 'Too, excessively. After an adjective it also works as an exclamation.',\n      note: 'Before the adjective it means \"excessively\" as a complaint; after it, it is closer to \"so!\" — Đẹp quá! = So beautiful!',\n      senses: [{ def: 'Too, excessively (complaint).', exVi: 'Đắt quá!', exEn: 'Too expensive!' }, { def: 'So, very (admiration).', exVi: 'Ngon quá!', exEn: 'So delicious!' }],\n      colls: [{ vi: 'quá đắt', en: 'far too dear' }, { vi: 'tốt quá', en: 'great!' }] },\n    'Giảm giá': { gloss: 'discount', pos: 'verb', mark: 'new',\n      def: 'To lower the price, to discount. The bargaining verb at any market.',\n      note: 'Softer than bớt (cut off). Ask \"giảm giá được không?\" with a smile; in a shop with price tags, do not.',\n      senses: [{ def: 'To discount, to lower a price.', exVi: 'Giảm giá được không?', exEn: 'Can you lower the price?' }, { def: 'A sale, a price reduction (noun).', exVi: 'Hôm nay có giảm giá.', exEn: 'There is a sale today.' }],\n      colls: [{ vi: 'bớt một chút', en: 'take a bit off' }, { vi: 'giá cuối', en: 'final price' }] },\n    'được không': { gloss: 'can you?', pos: 'phrase', mark: 'known',\n      def: 'Tag question asking permission or possibility — \"is that OK?\"',\n      note: 'Sits at the end of the sentence. Answer is được (yes, fine) or không được (no).',\n      senses: [{ def: 'Asking permission — may I?', exVi: 'Tôi ngồi đây được không?', exEn: 'May I sit here?' }, { def: 'Asking possibility — can you?', exVi: 'Giảm giá được không?', exEn: 'Can you discount it?' }],\n      colls: [{ vi: 'được', en: 'yes, fine' }, { vi: 'không được', en: 'no, cannot' }] },\n  };\n\n  VLINES = [\n    { t: '0:15', en: 'Hello!', ws: ['Xin', 'chào'] },\n    { t: '0:40', en: 'Thank you very much.', ws: ['Cảm ơn', 'nhiều'] },\n    { t: '1:10', en: 'How much is this?', ws: ['Cái này', 'bao nhiêu', 'tiền'], active: true },\n    { t: '1:38', en: 'Too expensive! Can you lower it?', ws: ['Đắt', 'quá', 'Giảm giá', 'được không'] },\n  ];\n\n  ENTRIES = {\n    'phở': {\n      tone: 'hỏi',\n      seen: [\n        { t: '1:10', src: 'Video · 20 câu cho người mới', line: 'Cái này bao nhiêu tiền? — a phở stall', go: 'video' },\n        { t: 'Turn 2', src: 'Talk · quán phở roleplay', line: 'Tôi muốn phở bò.', go: 'chat' },\n      ],\n      pos: 'Danh từ · noun', level: 'A1', tone: 'Thanh hỏi', syl: '1 âm tiết', etym: { glyph: '頗', title: 'Hán-Việt liên hệ', body: 'Likely from French pot-au-feu and Cantonese 河粉 — a street-food creole.' },\n      def: [{ t: 'A soup of rice noodles, herbs and beef or chicken in a clear, slow-simmered ' }, { t: 'nước dùng', link: 'nước dùng' }, { t: ' — eaten at any hour, most often for breakfast.' }],\n      region: {\n        north: { say: 'Bát phở, ăn sáng', note: 'Clear, salt-forward broth. Served with quẩy and a plate of rau thơm. The bowl is a bát.' },\n        south: { say: 'Tô phở, thêm giá', note: 'Sweeter broth, bigger bowl — a tô. Comes with bean sprouts, húng quế and hoisin on the side.' },\n      },\n      cls: [\n        { c: 'bát', en: 'bowl (North)', ok: true, note: 'The northern bowl. Một bát phở is what you order in Hà Nội.' },\n        { c: 'tô', en: 'bowl (South)', ok: true, note: 'Same thing in Sài Gòn, and usually larger.' },\n        { c: 'ly', en: 'glass', ok: false, note: 'Ly is for drinks. Nobody serves phở in a glass.' },\n        { c: 'cái', en: 'generic', ok: false, note: 'Cái is the catch-all, but with food in a bowl locals never use it.' },\n      ],\n      ex: [{ vi: 'Sáng nào tôi cũng ăn một bát phở.', en: 'I eat a bowl of phở every morning.' }, { vi: 'Cho tôi một tô phở bò, không rau mùi.', en: 'One beef phở, no coriander please.' }],\n      graph: [\n        { w: 'nước dùng', en: 'the broth it is built on', kind: 'part', link: 'nước dùng' },\n        { w: 'rau mùi', en: 'coriander — the thing to refuse', kind: 'goes with', link: 'rau mùi' },\n        { w: 'tính tiền', en: 'settle the bill afterwards', kind: 'next step', link: 'tính tiền' },\n        { w: 'bánh phở', en: 'the flat rice noodles themselves', kind: 'part' },\n      ],\n    },\n    'nước dùng': {\n      tone: 'huyền',\n      seen: [\n        { t: '2:41', src: 'Video · 20 câu cho người mới', line: 'Nước dùng ngon quá!', go: 'video' },\n      ],\n      pos: 'Danh từ · noun', level: 'A2', tone: 'Thanh sắc + huyền', syl: '2 âm tiết',\n      def: [{ t: 'The simmered stock a bowl of ' }, { t: 'phở', link: 'phở' }, { t: ' is built on — bones, ginger, star anise, hours of patience.' }],\n      region: {\n        north: { say: 'Nước dùng trong', note: 'Judged on clarity. A cloudy broth in Hà Nội is a bad sign.' },\n        south: { say: 'Nước lèo', note: 'In the South you will also hear nước lèo, and it runs sweeter.' },\n      },\n      cls: [\n        { c: 'bát', en: 'bowl', ok: true, note: 'A bowl of broth on its own — một bát nước dùng.' },\n        { c: 'nồi', en: 'pot', ok: true, note: 'The pot it lives in. Một nồi nước dùng feeds a morning.' },\n        { c: 'con', en: 'animate', ok: false, note: 'Con is for animals and living things.' },\n        { c: 'quả', en: 'fruit', ok: false, note: 'Quả counts round fruit — not liquids.' },\n      ],\n      ex: [{ vi: 'Nước dùng phải nấu sáu tiếng.', en: 'The broth has to simmer for six hours.' }, { vi: 'Nước dùng hôm nay ngọt quá.', en: 'The broth is very sweet today.' }],\n      graph: [\n        { w: 'phở', en: 'the dish it belongs to', kind: 'whole', link: 'phở' },\n        { w: 'nước mắm', en: 'fish sauce — same nước family', kind: 'family' },\n        { w: 'hầm', en: 'to stew, to simmer long', kind: 'verb' },\n      ],\n    },\n    'rau mùi': {\n      tone: 'huyền',\n      seen: [\n        { t: 'Turn 2', src: 'Talk · quán phở roleplay', line: 'Không rau mùi.', go: 'chat' },\n        { t: '3:04', src: 'Video · 20 câu cho người mới', line: 'Cho tôi không rau mùi nhé.', go: 'video' },\n      ],\n      pos: 'Danh từ · noun', level: 'A1', tone: 'Thanh ngang + huyền', syl: '2 âm tiết',\n      def: [{ t: 'Coriander, cilantro. The herb most often refused in a bowl of ' }, { t: 'phở', link: 'phở' }, { t: '.' }],\n      region: {\n        north: { say: 'Rau mùi', note: 'The standard northern name — this is the word in the dictionary.' },\n        south: { say: 'Ngò rí', note: 'Say rau mùi in Sài Gòn and you may get a blank look. Ask for ngò rí.' },\n      },\n      cls: [\n        { c: 'bó', en: 'bunch', ok: true, note: 'How it is sold at the market — một bó rau mùi.' },\n        { c: 'cây', en: 'stalk', ok: true, note: 'One single stalk, when you are picking it out of the bowl.' },\n        { c: 'cái', en: 'generic', ok: false, note: 'Herbs are counted by bunch or stalk, never with cái.' },\n        { c: 'bát', en: 'bowl', ok: false, note: 'A bowl is the container for the soup, not for the herb.' },\n      ],\n      ex: [{ vi: 'Cho tôi không rau mùi nhé.', en: 'No coriander for me, please.' }, { vi: 'Chị bán cho tôi một bó rau mùi.', en: 'Sell me a bunch of coriander.' }],\n      graph: [\n        { w: 'phở', en: 'where asy: 0 },\n  }));\n\n  chatScroller() {\n    if (this.chatEl && this.chatEl.isConnected) return this.chatEl;\n    return document.querySelector('[data-chat-scroll]');\n  }\n\n  chatBottom = () => {\n    const run = () => {\n      const el = this.chatScroller();\n      if (el) el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' });\n    };\n    requestAnimationFrame(() => { run(); setTimeout(run, 260); });\n  };\n\n  entryOf = () => this.ENTRIES[this.state.entry] || this.ENTRIES['phở'];\n  countIn = (w) => this.state.colls.filter(c => c.words.includes(w)).length;\n\n  openEntry = (w, push) => {\n    if (!this.ENTRIES[w]) return;\n    this.setState(s => ({\n      tab: 'dict', sub: 'entry', entry: w, cls: null, region: s.region,\n      trail: push && s.sub === 'entry' ? [...s.trail, s.entry] : s.trail,\n    }));\n    if (this.entryScrollEl) this.entryScrollEl.scrollTo({ top: 0 });\n  };\n\n  entryBack = () => this.setState(s => {\n    if (s.trail.length) return { entry: s.trail[s.trail.length - 1], trail: s.trail.slice(0, -1), cls: null };\n    return { sub: null };\n  });\n\n  save = (w) => {\n    if (this.countIn(w) > 0) { this.setState({ picker: true, pickWord: w, toast: false }); return; }\n    this.setState(s => ({\n      colls: s.colls.map(c => c.id === 'fav' ? { ...c, words: [...c.words, w] } : c),\n      pickWord: w, toast: true,\n    }));\n    clearTimeout(this.toastT);\n    this.toastT = setTimeout(() => this.setState({ toast: false }), 3600);\n  };\n\n  toggleColl = (id) => this.setState(s => ({\n    colls: s.colls.map(c => c.id !== id ? c : { ...c, words: c.words.includes(s.pickWord) ? c.words.filter(w => w !== s.pickWord) : [...c.words, s.pickWord] }),\n  }));\n\n  newColl = () => this.setState(s => {\n    const n = s.colls.filter(c => c.id.startsWith('new')).length + 1;\n    return { colls: [...s.colls, { id: 'new' + n, mark: String(n), name: 'Bộ từ ' + n, ink: '#204081', words: [s.pickWord] }] };\n  });\n\n  PEEK = 350;\n  FULL = 660;\n\n  flat() {\n
