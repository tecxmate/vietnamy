# CI gate for every push and pull request.
#
# Until this workflow existed, nothing guarded a PR except the Vercel deploy —
# lint errors, broken content data, and routes that crash on load all merged
# silently. Four checks, cheapest first:
#
#   lint       — zero-error policy repo-wide (compiler-era React diagnostics
#                are warnings; see eslint.config.js)
#   validate   — curriculum schema, the spelling lexicon⟷rules contract, and
#                the spoken-number rules
#   build      — the production bundle must compile
#   smoke      — the built app boots; every key route renders in a real
#                Chromium with no page errors (scripts/smoke-routes.mjs)

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Validate curriculum
        run: npm run validate:curriculum

      - name: Validate spelling lexicon
        run: npm run validate:spell

      - name: Validate grammar quizzes
        run: npm run validate:grammar

      - name: Validate Vietnamese numbers
        run: npm run validate:numbers

      - name: Build
        run: npx vite build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke test routes
        run: npm run test:smoke
